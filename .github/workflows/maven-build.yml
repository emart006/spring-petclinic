name: "JFrog Maven & Docker Build"
on: push

env:
  # Replace these with your actual JFrog Docker repository and image name
  DOCKER_REPO: "spring-petclinic-docker-local"
  IMAGE_NAME: "spring-petclinic"

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
         
      - name: Setup JFrog CLI
        uses: jfrog/setup-jfrog-cli@v4
        env:  
          JF_URL: ${{ vars.JF_URL }}
          JF_ACCESS_TOKEN: ${{ secrets.JF_ACCESS_TOKEN }}
           
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set Maven CLI Config
        run: |
          jf mvnc \
            --repo-resolve-releases=spring-petclinic-libs-snapshot \
            --repo-resolve-snapshots=spring-petclinic-libs-snapshot \
            --repo-deploy-releases=spring-petclinic-libs-snapshot-local \
            --repo-deploy-snapshots=spring-petclinic-libs-snapshot-local
            
      - name: Run Tests & Build Jar
        # 'mvn install' runs the test phase by default.
        # We assign a build name/number to track this specific execution.
        run: |
          jf mvn clean install -U \
            -Dmaven.wagon.http.ssl.insecure=true \
            -Dmaven.wagon.http.ssl.allowall=true

      - name: Docker Login
        # Authenticates Docker to your Artifactory registry automatically
        run: jf docker login
         
      - name: Build & Push Docker Image
        run: |
          # 1. Clean the JF_URL to get just the hostname for Docker
          # Example: https://solengemdemo.jfrog.io/artifactory -> solengemdemo.jfrog.io
          REGISTRY_URL=$(echo "${{ vars.JF_URL }}" | sed -e 's|https://||' -e 's|http://||' -e 's|/artifactory||' -e 's|/||g')
          
          # 2. Construct the full tag
          # Format: <hostname>/<repo-key>/<image-name>:<tag>
          FULL_IMAGE_TAG="$REGISTRY_URL/spring-petclinic-docker-local/spring-petclinic:${{ github.run_number }}"
          
          echo "Building image: $FULL_IMAGE_TAG"
          
          # 3. Build the image (looks for 'Dockerfile' in the current directory)
          jf docker build -t $FULL_IMAGE_TAG .
          
          # 4. Push to Artifactory
          jf docker push $FULL_IMAGE_TAG

          
      - name: Publish Build info
        # Links your Maven artifacts and Docker layers into a single traceable record
        run: |
          jf rt build-collect-env
          jf rt build-add-git
          jf rt build-publish
